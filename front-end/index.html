<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFlix - Delivery Imersivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Barra Lateral -->
        <aside class="sidebar">
            <div class="logo">🍔 FoodFlix</div>
            <nav class="menu">
                <a href="#" class="active">🏠 Início</a>
                <a href="#">🔍 Buscar</a>
                <a href="#">📜 Meus Pedidos</a>
                <a href="#">❤️ Favoritos</a>
                <a href="#">⚙️ Configurações</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Barra Superior / Carrinho -->
            <header class="topbar">
                <div class="search-bar">
                    <input type="text" placeholder="Busque por pratos ou restaurantes...">
                </div>
                <button class="cart-btn" onclick="toggleCart()">
                    🛒 Sacola <span id="cart-count" class="badge">0</span>
                </button>
            </header>

            <!-- Categorias (Filtros) -->
            <section class="categories-section">
                <h2>Categorias</h2>
                <div class="categories-scroll">
                    <button class="category-btn active">Tudo</button>
                    <button class="category-btn">🍕 Pizza</button>
                    <button class="category-btn">🍣 Sushi</button>
                    <button class="category-btn">🍔 Lanches</button>
                    <button class="category-btn">🥗 Saudável</button>
                    <button class="category-btn">🍦 Sobremesas</button>
                </div>
            </section>

            <!-- Trilhos estilo Netflix -->
            <section class="netflix-row">
                <h2>Populares na sua região</h2>
                <div class="row-scroll" id="popular-row">
                    <!-- Os itens serão injetados aqui pelo JavaScript -->
                </div>
            </section>

            <section class="netflix-row">
                <h2>Peça de Novo</h2>
                <div class="row-scroll" id="order-again-row">
                    <!-- Os itens serão injetados aqui pelo JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal do Carrinho -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Sua Sacola</h2>
            <button class="close-btn" onclick="toggleCart()">✖</button>
        </div>
        <div id="cart-items" class="cart-items">
            <p class="empty-cart">Sua sacola está vazia.</p>
        </div>
        <div class="cart-footer">
            <div class="total">Total: <span id="cart-total">R$ 0,00</span></div>
            <button class="checkout-btn">Finalizar Pedido</button>
        </div>
    </div>
    
    <!-- Overlay Escuro para o Modal -->
    <div id="overlay" class="overlay" onclick="toggleCart()"></div>

    <script src="script.js"></script>
</body>
</html>
